

<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AROG Restaurant</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#10100e;color:#f5e8c5;font-family:Arial,sans-serif}

header{text-align:center;padding:28px 10px;border-bottom:1px solid #b99a52}

h1{color:#d6b66b;font: bold 42px Georgia;letter-spacing:7px;margin:0}

.subtitle{color:#d2c39e;letter-spacing:3px;font-size:11px;margin-top:8px}

nav{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;padding:14px 8px}

button{cursor:pointer}

nav button,.lang button{background:#24221b;color:#e7ce91;border:1px solid #a88a48;padding:10px 13px;border-radius:22px}

button.active{background:#bd9b50;color:#17140e}

main{max-width:700px;margin:auto;padding:5px 16px 30px}

h2{color:#d6b66b;font:24px Georgia;border-bottom:1px solid #76602f;padding-bottom:10px}

.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 2px;border-bottom:1px solid #39352a}

.name{font-size:15px}

.weight{font-size:12px;color:#a99b7b;margin-top:5px}

.price{color:#e3c477;font-weight:bold;white-space:nowrap}

.qty{display:flex;align-items:center;gap:9px}

.qty button{background:#bd9b50;color:#17140e;border:0;border-radius:50%;width:29px;height:29px;font-size:18px}

.qty span{min-width:15px;text-align:center}

#order{border:1px solid #a88a48;border-radius:12px;padding:15px;margin:20px 0}

#order h2{margin-top:0}

.total{color:#e3c477;font-size:20px;font-weight:bold;text-align:right}

.waiter{display:block;margin:20px auto;background:#bd9b50;color:#17140e;border:0;padding:14px 25px;border-radius:25px;font-weight:bold}

.note{text-align:center;color:#b8aa8b;font-size:12px;padding:12px}

</style>

</head>

<body>

<header>

<h1>AROG</h1>

<div class="subtitle">RESTAURANT • PREMIUM MENU</div>

</header>

<nav class="lang">

<button class="active" onclick="setLang('tr',this)">Türkçe</button>

<button onclick="setLang('bg',this)">Български</button>

<button onclick="setLang('en',this)">English</button>

</nav>

<nav id="cats"></nav>

<main>

<div id="menu"></div>

<div id="order">

<h2 id="orderTitle">Sipariş Listem</h2>

<div id="orderItems">Henüz ürün seçilmedi.</div>

<p class="total" id="total">Toplam: 0 €</p>

</div>

</main>

<button class="waiter" id="waiter" onclick="alert(labels[lang].wait)">🔔 Garson Çağır</button>

<div class="note" id="note">Afiyet olsun!</div>

<script>

const labels={

tr:{soup:"Çorbalar",main:"Ana Yemekler",pizza:"Pizzalar",pide:"Pideler",order:"Sipariş Listem",empty:"Henüz ürün seçilmedi.",total:"Toplam",wait:"Garson çağırma bildirimi aktif değildir. Lütfen personelimize seslenin.",button:"Garson Çağır",note:"Afiyet olsun!"},

bg:{soup:"Супи",main:"Основни ястия",pizza:"Пици",pide:"Пидета",order:"Моята поръчка",empty:"Все още няма избрани ястия.",total:"Общо",wait:"Известията за сервитьор не са активни. Моля, обърнете се към персонала.",button:"Повикай сервитьор",note:"Добър апетит!"},

en:{soup:"Soups",main:"Main Dishes",pizza:"Pizzas",pide:"Pide",order:"My Order",empty:"No items selected yet.",total:"Total",wait:"Waiter notifications are not active. Please ask a staff member.",button:"Call Waiter",note:"Enjoy your meal!"}

};

const items=[

["main","Drobceta po selski","Селски дреболии","Village-style tripe",6,400],

["main","Arnavudski drobceta","Арнаутски дреболии","Albanian-style tripe",8,400],

["main","Lahmacun","Лахмаджун","Lahmacun",5,0],

["main","İskender kebap s pileshki dyuner","Искендер с пилешки дюнер","Chicken doner Iskender",7,450],

["main","İskender kebap s kayma dyuner","Искендер с кайма дюнер","Minced meat Iskender",9,450],

["main","İcli kyufte","Ичли кюфте","Stuffed kofte",5,300],

["soup","Tarator","Таратор","Tarator",2,250],

["soup","Shkembe supa","Шкембе чорба","Tripe soup",2,250],

["soup","Pileshka supa","Пилешка супа","Chicken soup",2,250],

["soup","Cervena leshta","Червена леща","Red lentil soup",2,250],

["soup","Domatena supa","Доматена супа","Tomato soup",2,250],

["soup","Supa topceta","Супа топчета","Meatball soup",2,250],

["pizza","Margarita","Маргарита","Margherita",5,400],

["pizza","Shunka","Шунка","Ham",5.5,450],

["pizza","Turski sucuk","Турски суджук","Turkish sucuk",6.5,500],

["pizza","Pileshki dyuner","Пилешки дюнер","Chicken doner",6.5,500],

["pizza","Riba ton","Риба тон","Tuna",5.5,500],

["pizza","Kapricoza","Капричоза","Capricciosa",7,550],

["pizza","Arog pizza","Пица АРОГ","AROG pizza",9,650],

["pide","Яйчен","Яйчен","Egg pide",7,450],

["pide","S kayma","С кайма","Minced meat pide",7,450],

["pide","S turski sudjuk","С турски суджук","Turkish sucuk pide",7,450],

["pide","S riba ton","С риба тон","Tuna pide",6,450],

["pide","Mesheno","Мешено","Mixed pide",8,500]

];

let lang="tr",category="soup";

let quantities={};

function nameOf(x){

 return lang==="tr"?x[1]:lang==="bg"?x[2]:x[3];

}

function setLang(l,button){

 lang=l;

 document.querySelectorAll(".lang button").forEach(b=>b.classList.remove("active"));

 button.classList.add("active");

 render();

}

function changeQty(index,delta){

 quantities[index]=Math.max(0,(quantities[index]||0)+delta);

 render();

}

function render(){

 const t=labels[lang];

 const cats=document.getElementById("cats");

 cats.innerHTML="";

 ["soup","main","pizza","pide"].forEach(c=>{

  const b=document.createElement("button");

  b.textContent=t[c];

  if(c===category)b.classList.add("active");

  b.onclick=()=>{category=c;render()};

  cats.appendChild(b);

 });

 const menu=document.getElementById("menu");

 menu.innerHTML="<h2>"+t[category]+"</h2>";

 items.forEach((x,i)=>{

  if(x[0]!==category)return;

  const div=document.createElement("div");

  div.className="item";

  const info=document.createElement("div");

  info.innerHTML='<div class="name"></div><div class="weight"></div>';

  info.querySelector(".name").textContent=nameOf(x);

  info.querySelector(".weight").textContent=x[5]?x[5]+" g":"";

  const controls=document.createElement("div");

  controls.className="qty";

  const minus=document.createElement("button");

  minus.textContent="−";minus.onclick=()=>changeQty(i,-1);

  const count=document.createElement("span");

  count.textContent=quantities[i]||0;

  const plus=document.createElement("button");

  plus.textContent="+";plus.onclick=()=>changeQty(i,1);

  const price=document.createElement("span");

  price.className="price";price.textContent=x[4]+" €";

  controls.append(minus,count,plus);

  div.append(info,price,controls);

  menu.appendChild(div);

 });

 document.getElementById("orderTitle").textContent=t.order;

 document.getElementById("waiter").textContent="🔔 "+t.button;

 document.getElementById("note").textContent=t.note;

 renderOrder();

}

function renderOrder(){

 const t=labels[lang],box=document.getElementById("orderItems");

 box.innerHTML="";

 let total=0,found=false;

 items.forEach((x,i)=>{

  const q=quantities[i]||0;

  if(!q)return;

  found=true;total+=q*x[4];

  const line=document.createElement("p");

  line.textContent=nameOf(x)+" × "+q+" — "+(q*x[4]).toFixed(2)+" €";

  box.appendChild(line);

 });

 if(!found)box.textContent=t.empty;

 document.getElementById("total").textContent=t.total+": "+total.toFixed(2)+" €";

}

render();

</script>

</body>

</html>
