<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AROG Restaurant Menu</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#f5f0e6;font-family:Arial,sans-serif}
header{text-align:center;padding:22px 12px;background:#080808;border-bottom:2px solid #c9a64b}
header h1{margin:0;color:#d8b65b;font-size:30px;letter-spacing:4px}
header p{margin:7px 0 0;color:#ddd;font-size:13px}
.language{display:flex;justify-content:center;gap:8px;padding:14px}
.language button,.categories button{background:#222;color:#d8b65b;border:1px solid #a98735;border-radius:20px;padding:9px 14px;font-weight:bold}
.language button.active,.categories button.active{background:#c9a64b;color:#111}
.categories{display:flex;gap:8px;overflow-x:auto;padding:10px;position:sticky;top:0;background:#111;z-index:5;white-space:nowrap}
.categories button{flex-shrink:0}
main{padding:12px;max-width:750px;margin:auto}
h2{color:#d8b65b;border-bottom:1px solid #80672e;padding-bottom:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 4px;border-bottom:1px solid #393328}
.item-info{flex:1}
.item-name{font-weight:bold;font-size:16px}
.item-detail{color:#aaa;font-size:12px;margin-top:5px}
.price{color:#e3c16b;font-weight:bold;white-space:nowrap}
.controls{display:flex;align-items:center;gap:8px;margin-left:8px}
.controls button{width:28px;height:28px;border-radius:50%;border:1px solid #c9a64b;background:#222;color:#e3c16b;font-size:18px}
.qty{min-width:14px;text-align:center}
#order{margin:22px 0;padding:16px;background:#1d1a14;border:1px solid #9c7b34;border-radius:10px}
#order h2{margin-top:0}
.order-line{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.total{font-size:20px;color:#e3c16b;font-weight:bold;border-top:1px solid #80672e;padding-top:12px;margin-top:10px}
.empty{color:#aaa;font-size:14px}
</style>
</head>
<body>
<header>
<h1>AROG</h1>
<p>RESTAURANT & FAST FOOD</p>
</header>

<div class="language">
<button class="active" onclick="setLanguage('tr',this)">🇹🇷 Türkçe</button>
<button onclick="setLanguage('bg',this)">🇧🇬 Български</button>
<button onclick="setLanguage('en',this)">🇬🇧 English</button>
</div>

<nav class="categories" id="categories"></nav>
<main>
<h2 id="categoryTitle"></h2>
<div id="menu"></div>
<div id="order">
<h2 id="orderTitle">Sipariş Özeti</h2>
<div id="orderItems"><p class="empty">Henüz ürün seçilmedi.</p></div>
<div class="total"><span id="totalLabel">Toplam</span>: <span id="total">0.00</span> €</div>
</div>
</main>

["fish","Sazan Dilimi","Шаран на шайба","Carp Steak",5,150],
["fish","Garnitürlü Kefal Dilimi","Толостолоб на шайба с гарнитура","Silver Carp Steak with Side Dish",7,200],
["fish","Garnitürlü Kefal Dilimi","Толостолоб на шайба с гарнитура","Silver Carp Steak with Side Dish",8,200],

["meze","Kaşar","Кашкавал","Kashkaval Cheese",5,200],
["meze","Karışık Meze","Мешано мезе","Mixed Appetizers",8,400],
["meze","Sucuk","Суджук","Sucuk",5,200],
["meze","Karışık Fıstık","Микс ядки","Mixed Nuts",3,150],

["dessert","Ekler","Еклери","Eclairs",2,0],
["dessert","Pasta","Торта","Cake",2.5,0],
["dessert","Kurabiye","Бисквити","Cookies",0.5,0],
["dessert","Sütlaç","Мляко с ориз","Rice Pudding",2,0],
["dessert","Dondurma","Сладолед","Ice Cream",2.5,0]
];

let language="tr";
let selectedCategory="soup";
let quantities={};

const categoryOrder=[
"soup","main","pizza","pide","doner","zakuski","salati",
"grill","garnitur","kizartmalar","fish","meze","dessert"
];

function setLanguage(lang,button){
 language=lang;
 document.querySelectorAll(".language button").forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 renderCategories();
 renderMenu();
 renderOrder();
 document.getElementById("orderTitle").textContent=
 lang==="tr"?"Sipariş Özeti":lang==="bg"?"Обобщение на поръчката":"Order Summary";
 document.getElementById("totalLabel").textContent=
 lang==="tr"?"Toplam":lang==="bg"?"Общо":"Total";
}

function renderCategories(){
 const nav=document.getElementById("categories");
 nav.innerHTML="";
 categoryOrder.forEach(cat=>{
  const b=document.createElement("button");
  b.textContent=categoryNames[language][cat];
  if(cat===selectedCategory)b.classList.add("active");
  b.onclick=()=>{
   selectedCategory=cat;
   renderCategories();
   renderMenu();
  };
  nav.appendChild(b);
 });
}

function getName(item){
 return item[language==="tr"?1:language==="bg"?2:3];
}

function getWeight(item){
 const w=item[5];
 if(typeof w==="string"){
  if(w==="1,5 kg")return language==="en"?"1.5 kg":"1,5 kg";
  if(w==="10 adet / 200 g"){
   return language==="tr"?"10 adet / 200 g":
          language==="bg"?"10 бр. / 200 г":"10 pcs / 200 g";
  }
  return w;
 }
 if(!w)return "";
 return language==="bg"?w+" г":w+" g";
}

function renderMenu(){
 const menu=document.getElementById("menu");
 document.getElementById("categoryTitle").textContent=categoryNames[language][selectedCategory];
 menu.innerHTML="";
 products.forEach((item,index)=>{
  if(item[0]!==selectedCategory)return;

  const div=document.createElement("div");
  div.className="item";

  const info=document.createElement("div");
  info.className="item-info";

  const name=document.createElement("div");
  name.className="item-name";
  name.textContent=getName(item);

  const detail=document.createElement("div");
  detail.className="item-detail";
  detail.textContent=getWeight(item);

  info.append(name,detail);

  const price=document.createElement("div");
  price.className="price";
  price.textContent=item[4].toFixed(2)+" €";

  const controls=document.createElement("div");
  controls.className="controls";

  const minus=document.createElement("button");
  minus.textContent="−";
  minus.onclick=()=>changeQty(index,-1);

  const qty=document.createElement("span");
  qty.className="qty";
  qty.id="qty-"+index;
  qty.textContent=quantities[index]||0;

  const plus=document.createElement("button");
  plus.textContent="+";
  plus.onclick=()=>changeQty(index,1);

  controls.append(minus,qty,plus);
  div.append(info,price,controls);
  menu.appendChild(div);
 });
}

function changeQty(index,change){
 quantities[index]=(quantities[index]||0)+change;
 if(quantities[index]<=0)delete quantities[index];

 const el=document.getElementById("qty-"+index);
 if(el)el.textContent=quantities[index]||0;

 renderOrder();
}

function renderOrder(){
 const container=document.getElementById("orderItems");
 container.innerHTML="";
 let total=0;
 let count=0;

 products.forEach((item,index)=>{
  const qty=quantities[index]||0;
  if(!qty)return;

  count+=qty;
  const sum=item[4]*qty;
  total+=sum;

  const line=document.createElement("div");
  line.className="order-line";

  const name=document.createElement("span");
  name.textContent=getName(item)+" × "+qty;

  const price=document.createElement("span");
  price.textContent=sum.toFixed(2)+" €";

  line.append(name,price);
  container.appendChild(line);
 });

 if(!count){
  const empty=document.createElement("p");
  empty.className="empty";
  empty.textContent=language==="tr"?"Henüz ürün seçilmedi.":
                    language==="bg"?"Все още няма избрани продукти.":
                    "No products selected yet.";
  container.appendChild(empty);
 }

 document.getElementById("total").textContent=total.toFixed(2);
}

renderCategories();
renderMenu();
renderOrder();
</script>
