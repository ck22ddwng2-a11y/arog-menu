

<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#10100e">

<title>AROG Restaurant | Premium Menu</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;background:#10100e;color:#f5e8c5;

  font-family:Arial,sans-serif

}

header{

  text-align:center;padding:30px 10px 24px;

  border-bottom:1px solid #b99a52

}

h1{

  color:#d6b66b;font:bold 44px Georgia,serif;

  letter-spacing:8px;margin:0

}

.subtitle{

  color:#d2c39e;letter-spacing:3px;

  font-size:11px;margin-top:9px

}

nav{

  display:flex;justify-content:center;

  flex-wrap:wrap;gap:8px;padding:13px 8px

}

button{cursor:pointer;font-family:inherit}

.lang button,.categories button{

  background:#24221b;color:#e7ce91;

  border:1px solid #a88a48;

  padding:10px 14px;border-radius:22px

}

button.active{background:#bd9b50;color:#17140e}

main{max-width:700px;margin:auto;padding:5px 16px 30px}

h2{

  color:#d6b66b;font:24px Georgia,serif;

  border-bottom:1px solid #76602f;padding-bottom:11px

}

.item{

  display:flex;align-items:center;

  justify-content:space-between;gap:10px;

  padding:15px 2px;border-bottom:1px solid #39352a

}

.info{flex:1;min-width:0}

.name{font-size:15px;line-height:1.4}

.weight{font-size:12px;color:#a99b7b;margin-top:5px}

.price{color:#e3c477;font-weight:bold;white-space:nowrap}

.qty{display:flex;align-items:center;gap:9px}

.qty button{

  background:#bd9b50;color:#17140e;border:0;

  border-radius:50%;width:30px;height:30px;font-size:19px

}

.qty span{min-width:15px;text-align:center}

#order{

  border:1px solid #a88a48;border-radius:12px;

  padding:15px;margin:25px 0 20px

}

#order h2{margin-top:0}

.order-line{

  display:flex;justify-content:space-between;

  gap:10px;padding:7px 0;

  border-bottom:1px solid #39352a;font-size:14px

}

.total{

  color:#e3c477;font-size:21px;

  font-weight:bold;text-align:right;margin-bottom:4px

}

.note{text-align:center;color:#b8aa8b;font-size:12px;padding:15px}

@media(max-width:420px){

  .item{gap:7px}

  .name{font-size:14px}

  .qty{gap:6px}

  .price{font-size:14px}

  .qty button{width:28px;height:28px}

}

</style>

</head>

<body>

<header>

  <h1>AROG</h1>

  <div class="subtitle">RESTAURANT • PREMIUM MENU</div>

</header>

<nav class="lang">

  <button class="active" onclick="setLang('tr',this)">Türkçe</button>

  <button onclick="setLang('bg',this)">Български</button>

  <button onclick="setLang('en',this)">English</button>

</nav>

<nav class="categories" id="cats"></nav>

<main>

  <div id="menu"></div>

  <section id="order">

    <h2 id="orderTitle">Sipariş Listem</h2>

    <div id="orderItems">Henüz ürün seçilmedi.</div>

    <p class="total" id="total">Toplam: 0.00 €</p>

  </section>

</main>

<div class="note" id="note">Afiyet olsun!</div>

<script>

const labels={

tr:{

soup:"Çorbalar",main:"Ana Yemekler",

pizza:"Pizzalar",pide:"Pideler",

order:"Sipariş Listem",

empty:"Henüz ürün seçilmedi.",

total:"Toplam",note:"Afiyet olsun!"

},

bg:{

soup:"Супи",main:"Основни ястия",

pizza:"Пици",pide:"Пидета",

order:"Моята поръчка",

empty:"Все още няма избрани ястия.",

total:"Общо",note:"Добър апетит!"

},

en:{

soup:"Soups",main:"Main Dishes",

pizza:"Pizzas",pide:"Pide",

order:"My Order",

empty:"No items selected yet.",

total:"Total",note:"Enjoy your meal!"

}

};

const items=[

["main","Köy Usulü Sakatat Kavurma","Селски дреболии","Village-Style Offal",6,400],

["main","Arnavut Usulü Sakatat Kavurma","Албански дреболии","Albanian-Style Offal",8,400],

["main","Lahmacun","Лахмаджун","Lahmacun",5,0],

["main","Tavuk Dönerli İskender Kebap","Искендер с пилешки дюнер","Chicken Doner Iskender",7,450],

["main","Kıymalı Dönerli İskender Kebap","Искендер с дюнер от кайма","Minced Meat Doner Iskender",9,450],

["main","İçli Köfte","Ичли кюфте","Stuffed Bulgur Kofte",5,300],

["soup","Tarator","Таратор","Tarator",2,250],

["soup","İşkembe Çorbası","Шкембе чорба","Tripe Soup",2,250],

["soup","Tavuk Çorbası","Пилешка супа","Chicken Soup",2,250],

["soup","Kırmızı Mercimek Çorbası","Супа от червена леща","Red Lentil Soup",2,250],

["soup","Domates Çorbası","Доматена супа","Tomato Soup",2,250],

["soup","Köfteli Çorba","Супа топчета","Meatball Soup",2,250],

["pizza","Margarita Pizza","Пица Маргарита","Margherita Pizza",5,400],

["pizza","Jambonlu Pizza","Пица с шунка","Ham Pizza",5.5,450],

["pizza","Türk Sucuklu Pizza","Пица с турски суджук","Turkish Sucuk Pizza",6.5,500],

["pizza","Tavuk Dönerli Pizza","Пица с пилешки дюнер","Chicken Doner Pizza",6.5,500],

["pizza","Ton Balıklı Pizza","Пица с риба тон","Tuna Pizza",5.5,500],

["pizza","Kapriçyoza Pizza","Пица Капричоза","Capricciosa Pizza",7,550],

["pizza","AROG Pizza","Пица АРОГ","AROG Pizza",9,650],

["pide","Yumurtalı Pide","Пиде с яйце","Egg Pide",7,450],

["pide","Kıymalı Pide","Пиде с кайма","Minced Meat Pide",7,450],

["pide","Türk Sucuklu Pide","Пиде с турски суджук","Turkish Sucuk Pide",7,450],

["pide","Ton Balıklı Pide","Пиде с риба тон","Tuna Pide",6,450],

["pide","Karışık Pide","Смесено пиде","Mixed Pide",8,500]

];



let lang="tr";

let category="soup";

let quantities={};

function nameOf(item){

  if(lang==="tr") return item[1];

  if(lang==="bg") return item[2];

  return item[3];

}

function setLang(language,button){

  lang=language;

  document.querySelectorAll(".lang button").forEach(b=>{

    b.classList.remove("active");

  });

  button.classList.add("active");

  render();

}

function changeQty(index,delta){

  quantities[index]=Math.max(0,(quantities[index]||0)+delta);

  render();

}

function render(){

  const t=labels[lang];

  const cats=document.getElementById("cats");

  cats.innerHTML="";

  ["soup","main","pizza","pide"].forEach(c=>{

    const b=document.createElement("button");

    b.textContent=t[c];

    if(c===category)b.classList.add("active");

    b.onclick=()=>{

      category=c;

      render();

    };

    cats.appendChild(b);

  });

  const menu=document.getElementById("menu");

  menu.innerHTML="";

  const heading=document.createElement("h2");

  heading.textContent=t[category];

  menu.appendChild(heading);

  items.forEach((item,i)=>{

    if(item[0]!==category)return;

    const div=document.createElement("div");

    div.className="item";

    const info=document.createElement("div");

    info.className="info";

    const name=document.createElement("div");

    name.className="name";

    name.textContent=nameOf(item);

    const weight=document.createElement("div");

    weight.className="weight";

    weight.textContent=item[5] ? item[5]+" g" : "";

    info.append(name,weight);

    const price=document.createElement("span");

    price.className="price";

    price.textContent=item[4].toFixed(2)+" €";

    const controls=document.createElement("div");

    controls.className="qty";

    const minus=document.createElement("button");

    minus.type="button";

    minus.textContent="−";

    minus.onclick=()=>changeQty(i,-1);

    const count=document.createElement("span");

    count.textContent=quantities[i]||0;

    const plus=document.createElement("button");

    plus.type="button";

    plus.textContent="+";

    plus.onclick=()=>changeQty(i,1);

    controls.append(minus,count,plus);

    div.append(info,price,controls);

    menu.appendChild(div);

  });

  document.getElementById("orderTitle").textContent=t.order;

  document.getElementById("note").textContent=t.note;

  renderOrder();

}

function renderOrder(){

  const t=labels[lang];

  const box=document.getElementById("orderItems");

  box.innerHTML="";

  let total=0;

  let found=false;

  items.forEach((item,i)=>{

    const q=quantities[i]||0;

    if(!q)return;

    found=true;

    total+=q*item[4];

    const line=document.createElement("div");

    line.className="order-line";

    const product=document.createElement("span");

    product.textContent=nameOf(item)+" × "+q;

    const amount=document.createElement("span");

    amount.textContent=(q*item[4]).toFixed(2)+" €";

    line.append(product,amount);

    box.appendChild(line);

  });

  if(!found)box.textContent=t.empty;

  document.getElementById("total").textContent=

    t.total+": "+total.toFixed(2)+" €";

}

render();

</script>

</body>

</html>
