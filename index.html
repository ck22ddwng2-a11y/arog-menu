

<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AROG Restaurant Menu</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  padding:20px 14px 110px;

  background:#111;

  color:#eee;

  font-family:Arial,sans-serif;

}

.container{max-width:650px;margin:auto}

header{text-align:center;padding:20px 0}

h1{

  color:#d4af37;

  font-size:36px;

  letter-spacing:4px;

  margin:5px;

}

.subtitle{color:#aaa;letter-spacing:2px}

.languages{text-align:center;margin:15px 0 25px}

.languages button{

  background:#222;color:#d4af37;

  border:1px solid #d4af37;

  padding:9px 15px;margin:4px;

  border-radius:6px;cursor:pointer;

}

.languages button.active{background:#d4af37;color:#111}

.category{

  color:#d4af37;

  border-bottom:1px solid #8d7425;

  padding-bottom:9px;

  margin-top:30px;

  font-size:22px;

}

.item{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  padding:14px 0;

  border-bottom:1px solid #333;

}

.item-info{flex:1}

.item-name{font-weight:bold;font-size:16px}

.item-detail{font-size:13px;color:#999;margin-top:5px}

.price{color:#d4af37;font-weight:bold;white-space:nowrap}

.controls{display:flex;align-items:center;gap:9px}

.controls button{

  width:30px;height:30px;

  border:1px solid #d4af37;

  border-radius:5px;

  background:#222;color:#d4af37;

  font-size:19px;cursor:pointer;

}

.qty{min-width:15px;text-align:center}

.cart{

  position:fixed;bottom:0;left:0;right:0;

  background:#1c1c1c;

  border-top:2px solid #d4af37;

  padding:15px;

  text-align:center;

  z-index:10;

}

.total{color:#d4af37;font-size:21px;font-weight:bold}

.cart button{

  margin-top:8px;

  background:#d4af37;color:#111;

  border:0;padding:10px 22px;

  border-radius:5px;font-weight:bold;

  cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<header>

  <h1>AROG</h1>

  <div class="subtitle">RESTAURANT MENU</div>

</header>

<div class="languages">

  <button class="active" onclick="setLang('tr',this)">🇹🇷 Türkçe</button>

  <button onclick="setLang('bg',this)">🇧🇬 Български</button>

  <button onclick="setLang('en',this)">🇬🇧 English</button>

</div>

<div id="menu"></div>

</div>

<div class="cart">

  <div id="total" class="total">Toplam: 0.00 €</div>

  <button onclick="clearCart()" id="clearButton">Sepeti Temizle</button>

</div>

<script>

const labels={

tr:{

soup:"Çorbalar",main:"Ana Yemekler",pizza:"Pizzalar",

pide:"Pideler",doner:"Döner",zakuski:"Zakuski",

total:"Toplam",clear:"Sepeti Temizle",

gram:"Gram",empty:"Sepet boş"

},

bg:{

soup:"Супи",main:"Основни ястия",pizza:"Пици",

pide:"Пидета",doner:"Дюнер",zakuski:"Закуски",

total:"Общо",clear:"Изчисти поръчката",

gram:"Грама",empty:"Поръчката е празна"

},

en:{

soup:"Soups",main:"Main Courses",pizza:"Pizzas",

pide:"Pides",doner:"Doner",zakuski:"Snacks",

total:"Total",clear:"Clear Order",

gram:"g",empty:"Cart is empty"

}

};

const items=[

{id:"s1",cat:"soup",name:{tr:"Mercimek Çorbası",bg:"Леща чорба",en:"Lentil Soup"},price:3,weight:300},

{id:"s2",cat:"soup",name:{tr:"Tavuk Çorbası",bg:"Пилешка супа",en:"Chicken Soup"},price:3,weight:300},

{id:"m1",cat:"main",name:{tr:"Tavuk Şiş",bg:"Пилешки шиш",en:"Chicken Skewers"},price:7,weight:350},

{id:"m2",cat:"main",name:{tr:"Köfte",bg:"Кюфтета",en:"Meatballs"},price:7,weight:350},

{id:"m3",cat:"main",name:{tr:"Izgara Köfte",bg:"Скара кюфтета",en:"Grilled Meatballs"},price:8,weight:400},

{id:"p1",cat:"pizza",name:{tr:"Margherita",bg:"Маргарита",en:"Margherita"},price:6,weight:400},

{id:"p2",cat:"pizza",name:{tr:"Karışık Pizza",bg:"Комбинирана пица",en:"Mixed Pizza"},price:8,weight:450},

{id:"pi1",cat:"pide",name:{tr:"Kaşarlı Pide",bg:"Пиде с кашкавал",en:"Cheese Pide"},price:6,weight:350},

{id:"pi2",cat:"pide",name:{tr:"Kıymalı Pide",bg:"Пиде с кайма",en:"Minced Meat Pide"},price:7,weight:400},

{id:"d1",cat:"doner",name:{tr:"Tabak Döner",bg:"Дюнер в чиния",en:"Doner Plate"},price:5,weight:400},

{id:"d2",cat:"doner",name:{tr:"Boks Döner",bg:"Бокс дюнер",en:"Box Doner"},price:4,weight:350},

{id:"d3",cat:"doner",name:{tr:"Döner",bg:"Дюнер",en:"Doner"},price:4,weight:300},

{id:"d4",cat:"doner",name:{tr:"Bomba Döner",bg:"Бомба дюнер",en:"Bomba Doner"},price:5,weight:400},

{id:"d5",cat:"doner",name:{tr:"Takos",bg:"Такос",en:"Tacos"},price:4,weight:350},

{id:"z1",cat:"zakuski",name:{tr:"Tost",bg:"Тост",en:"Toast"},price:2,weight:200},

{id:"z2",cat:"zakuski",name:{tr:"Princesa",bg:"Принцеса",en:"Princesa"},price:2,weight:200},

{id:"z3",cat:"zakuski",name:{tr:"Princesa sas salam",bg:"Принцеса със салам",en:"Princesa with salami"},price:2,weight:200},

{id:"z4",cat:"zakuski",name:{tr:"Hot dog",bg:"Хот дог",en:"Hot dog"},price:2.5,weight:250},

{id:"z5",cat:"zakuski",name:{tr:"Hamburger",bg:"Хамбургер",en:"Hamburger"},price:4,weight:250},

{id:"z6",cat:"zakuski",name:{tr:"Hamburger menü",bg:"Хамбургер меню",en:"Hamburger menu"},price:8,weight:400},

{id:"z7",cat:"zakuski",name:{tr:"Parlenka sas kashkaval",bg:"Пърленка с кашкавал",en:"Flatbread with cheese"},price:1.5,weight:150},

{id:"z8",cat:"zakuski",name:{tr:"Parlenka sas kashkaval i salam",bg:"Пърленка с кашкавал и салам",en:"Flatbread with cheese and salami"},price:2,weight:200},

{id:"z9",cat:"zakuski",name:{tr:"Kebap-köfte na pitka",bg:"Кебап-кюфте на питка",en:"Kebab meatball in bread"},price:2,weight:200}

];

let lang="tr";

let quantities={};

function setLang(language,button){

  lang=language;

  document.querySelectorAll(".languages button").forEach(b=>b.classList.remove("active"));

  button.classList.add("active");

  render();

}

function changeQty(id,amount){

  quantities[id]=(quantities[id]||0)+amount;

  if(quantities[id]<=0)delete quantities[id];

  render();

}

function render(){

  const menu=document.getElementById("menu");

  menu.innerHTML="";

  const categories=["soup","main","pizza","pide","doner","zakuski"];

  categories.forEach(cat=>{

    const categoryItems=items.filter(item=>item.cat===cat);

    if(!categoryItems.length)return;

    const heading=document.createElement("h2");

    heading.className="category";

    heading.textContent=labels[lang][cat];

    menu.appendChild(heading);

    categoryItems.forEach(item=>{

      const qty=quantities[item.id]||0;

      const row=document.createElement("div");

      row.className="item";

      const info=document.createElement("div");

      info.className="item-info";

      const name=document.createElement("div");

      name.className="item-name";

      name.textContent=item.name[lang];

      const detail=document.createElement("div");

      detail.className="item-detail";

      detail.textContent=item.weight+" "+labels[lang].gram;

      info.appendChild(name);

      info.appendChild(detail);

      const price=document.createElement("div");

      price.className="price";

      price.textContent=item.price.toFixed(2)+" €";

      const controls=document.createElement("div");

      controls.className="controls";

      const minus=document.createElement("button");

      minus.textContent="−";

      minus.onclick=()=>changeQty(item.id,-1);

      const count=document.createElement("span");

      count.className="qty";

      count.textContent=qty;

      const plus=document.createElement("button");

      plus.textContent="+";

      plus.onclick=()=>changeQty(item.id,1);

      controls.appendChild(minus);

      controls.appendChild(count);

      controls.appendChild(plus);

      row.appendChild(info);

      row.appendChild(price);

      row.appendChild(controls);

      menu.appendChild(row);

    });

  });

  updateTotal();

}

function updateTotal(){

  let total=0;

  items.forEach(item=>{

    total+=item.price*(quantities[item.id]||0);

  });

  document.getElementById("total").textContent=

    labels[lang].total+": "+total.toFixed(2)+" €";

  document.getElementById("clearButton").textContent=labels[lang].clear;

}

function clearCart(){

  quantities={};

  render();

}

render();

</script>

</body>

</html>
