

<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#10100e">

<title>AROG Restaurant | Premium Menu</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  background:#10100e;

  color:#f5e8c5;

  font-family:Arial,sans-serif;

}

header{

  text-align:center;

  padding:28px 10px 22px;

  border-bottom:1px solid #b99a52;

}

h1{

  color:#d6b66b;

  font:bold 44px Georgia,serif;

  letter-spacing:8px;

  margin:0;

}

.subtitle{

  color:#d2c39e;

  letter-spacing:3px;

  font-size:11px;

  margin-top:9px;

}

.lang{

  display:flex;

  justify-content:center;

  gap:8px;

  padding:12px 8px;

}

button{

  cursor:pointer;

  font-family:inherit;

}

.lang button{

  background:#24221b;

  color:#e7ce91;

  border:1px solid #a88a48;

  padding:9px 13px;

  border-radius:22px;

}

button.active{

  background:#bd9b50;

  color:#17140e;

}

.category-nav{

  position:sticky;

  top:0;

  z-index:10;

  background:#10100e;

  border-bottom:1px solid #a88a48;

  display:flex;

  justify-content:flex-start;

  flex-wrap:nowrap;

  overflow-x:auto;

  gap:8px;

  padding:12px 10px;

  scrollbar-width:thin;

}

.category-nav button{

  flex-shrink:0;

  background:#24221b;

  color:#e7ce91;

  border:1px solid #a88a48;

  padding:10px 14px;

  border-radius:22px;

  white-space:nowrap;

}

.category-nav button.active{

  background:#bd9b50;

  color:#17140e;

}

main{

  max-width:700px;

  margin:auto;

  padding:5px 16px 30px;

}

h2{

  color:#d6b66b;

  font:24px Georgia,serif;

  border-bottom:1px solid #76602f;

  padding-bottom:11px;

  margin-top:25px;

}

.item{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  padding:15px 2px;

  border-bottom:1px solid #39352a;

}

.info{

  flex:1;

  min-width:0;

}

.name{

  font-size:15px;

  line-height:1.4;

}

.weight{

  font-size:12px;

  color:#a99b7b;

  margin-top:5px;

}

.price{

  color:#e3c477;

  font-weight:bold;

  white-space:nowrap;

}

.qty{

  display:flex;

  align-items:center;

  gap:9px;

}

.qty button{

  background:#bd9b50;

  color:#17140e;

  border:0;

  border-radius:50%;

  width:30px;

  height:30px;

  font-size:19px;

}

.qty span{

  min-width:15px;

  text-align:center;

}

#order{

  border:1px solid #a88a48;

  border-radius:12px;

  padding:15px;

  margin:25px 0 20px;

}

#order h2{

  margin-top:0;

}

.order-line{

  display:flex;

  justify-content:space-between;

  gap:10px;

  padding:7px 0;

  border-bottom:1px solid #39352a;

  font-size:14px;

}

.total{

  color:#e3c477;

  font-size:21px;

  font-weight:bold;

  text-align:right;

  margin-bottom:4px;

}

.note{

  text-align:center;

  color:#b8aa8b;

  font-size:12px;

  padding:15px;

}

@media(max-width:420px){

  .item{gap:7px}

  .name{font-size:14px}

  .qty{gap:6px}

  .price{font-size:14px}

  .qty button{

    width:28px;

    height:28px;

  }

}

</style>

</head>

<body>

<header>

  <h1>AROG</h1>

  <div class="subtitle">RESTAURANT • PREMIUM MENU</div>

</header>

<nav class="lang">

  <button class="active" onclick="setLang('tr',this)">Türkçe</button>

  <button onclick="setLang('bg',this)">Български</button>

  <button onclick="setLang('en',this)">English</button>

</nav>

<nav id="categoryNav" class="category-nav"></nav>

<main>

  <div id="menu"></div>

  <section id="order">

    <h2 id="orderTitle">Sipariş Listem</h2>

    <div id="orderItems">Henüz ürün seçilmedi.</div>

    <p class="total" id="total">Toplam: 0.00 €</p>

  </section>

</main>

<div class="note" id="note">Afiyet olsun!</div>

<script>

const labels={

tr:{

  soup:"Çorbalar",

  main:"Ana Yemekler",

  pizza:"Pizzalar",

  pide:"Pideler",

  doner:"Döner",

  zakuski:"Zakuski",

  salati:"Salatalar",

  grill:"Izgara",

  order:"Sipariş Listem",

  empty:"Henüz ürün seçilmedi.",

  total:"Toplam",

  note:"Afiyet olsun!"

},

bg:{

  soup:"Супи",

  main:"Основни ястия",

  pizza:"Пици",

  pide:"Пидета",

  doner:"Дюнер",

  zakuski:"Закуски",

  salati:"Салати",

  grill:"Скара",

  order:"Моята поръчка",

  empty:"Все още няма избрани ястия.",

  total:"Общо",

  note:"Добър апетит!"

},

en:{

  soup:"Soups",

  main:"Main Dishes",

  pizza:"Pizzas",

  pide:"Pide",

  doner:"Doner",

  zakuski:"Snacks",

  salati:"Salads",

  grill:"Grill",

  order:"My Order",

  empty:"No items selected yet.",

  total:"Total",

  note:"Enjoy your meal!"

}

};

const categories=[

  "soup",

  "main",

  "pizza",

  "pide",

  "doner",

  "zakuski",

  "salati",

  "grill"

];

const items=[

/* ANA YEMEKLER */

["main","Köy Usulü Sakatat Kavurma","Селски дробчета","Village-Style Offal",6,400],

["main","Arnavut Usulü Sakatat Kavurma","Арнавудски дробчета","Albanian-Style Offal",8,400],

["main","Lahmacun","Лахмаджун","Lahmacun",5,0],

["main","Tavuk Dönerli İskender Kebap","Искендер с пилешки дюнер","Chicken Doner Iskender",7,450],

["main","Kıyma Dönerli İskender Kebap","Искендер с дюнер от кайма","Minced Meat Doner Iskender",9,450],

["main","İçli Köfte","Ичли кюфте","Stuffed Bulgur Kofte",5,300],

/* ÇORBALAR */

["soup","cacık","Таратор","Tarator",2,250],

["soup","İşkembe Çorbası","Шкембе чорба","Tripe Soup",2,250],

["soup","Tavuk Çorbası","Пилешка супа","Chicken Soup",2,250],

["soup","Kırmızı Mercimek Çorbası","Супа от червена леща","Red Lentil Soup",2,250],

["soup","Domates Çorbası","Доматена супа","Tomato Soup",2,250],

["soup","Köfteli Çorba","Супа топчета","Meatball Soup",2,250],

/* PİZZALAR */

["pizza","Margarita Pizza","Пица Маргарита","Margherita Pizza",5,400],

["pizza","Jambonlu Pizza","Пица с шунка","Ham Pizza",5.5,450],

["pizza","Türk Sucuklu Pizza","Пица с турски суджук","Turkish Sucuk Pizza",6.5,500],

["pizza","Tavuk Dönerli Pizza","Пица с пилешки дюнер","Chicken Doner Pizza",6.5,500],

["pizza","Ton Balıklı Pizza","Пица с риба тон","Tuna Pizza",5.5,500],

["pizza","Kapriçyoza Pizza","Пица Капричоза","Capricciosa Pizza",7,550],

["pizza","AROG Pizza","Пица АРОГ","AROG Pizza",9,650],

/* PİDELER */

["pide","Yumurtalı Pide","Пиде с яйце","Egg Pide",7,450],

["pide","Kıymalı Pide","Пиде с кайма","Minced Meat Pide",7,450],

["pide","Türk Sucuklu Pide","Пиде с турски суджук","Turkish Sucuk Pide",7,450],

["pide","Ton Balıklı Pide","Пиде с риба тон","Tuna Pide",6,450],

["pide","Karışık Pide","Смесено пиде","Mixed Pide",8,500],

/* DÖNER */

["doner","Tabak Döner","Дюнер в чиния","Doner Plate",5,400],

["doner","Boks Döner","Бокс дюнер","Box Doner",4,350],

["doner","Döner","Дюнер","Doner",4,300],

["doner","Bomba Döner","Бомба дюнер","Bomba Doner",5,400],

["doner","Takos","Такос","Tacos",4,350],

/* ZAKUSKI */

["zakuski","Tost","Тост","Toast",2,200],

["zakuski","Princesa","Принцеса","Princesa",2,200],

["zakuski","Princesa sas salam","Принцеса със салам","Princesa with salami",2,200],

["zakuski","Hot dog","Хот дог","Hot dog",2.5,250],

["zakuski","Hamburger","Хамбургер","Hamburger",4,250],

["zakuski","Hamburger menü","Хамбургер меню","Hamburger menu",8,400],

["zakuski","Parlenka sas kashkaval","Пърленка с кашкавал","Flatbread with cheese",1.5,150],

["zakuski","Parlenka sas kashkaval i salam","Пърленка с кашкавал и салам","Flatbread with cheese and salami",2,200],

["zakuski","Kebap-köfte na pitka","Кебап-кюфте на питка","Kebab meatball in bread",2,200],

/* SALATALAR */

["salati","Şopska salata","Шопска салата","Shopska Salad",5,350],

["salati","Cezar salata","Цезар салата","Caesar Salad",6,350],

["salati","Coban salata","Овчарска салата","Shepherd's Salad",6,350],

["salati","Lahana Salatası","Зелева салата","Cabbage Salad",3,300],

/* 8. IZGARA */

["grill","Köfte","Кюфте","Meatball",1.5,80],

["grill","Kebap","Кебап","Kebab",1.5,80],

["grill","Ev Yapımı Köfte","Домашно кюфте","Homemade Meatball",2,80],

["grill","Parmak Sucuk","Карначи","Finger Sucuk",7,500],

["grill","Tavuk Şiş","Пилешки шиш","Chicken Skewer",3.5,130],

["grill","Dana Şiş","Телешки шиш","Beef Skewer",5,130],

["grill","Domuz Şiş","Свински шиш","Pork Skewer",4,130],

["grill","Domuz Pirzola","Свинска пържола","Pork Chop",4.5,200],

["grill","Tavuk Pirzola","Пилешка пържола","Chicken Chop",4.5,200],

["grill","Karışık Izgara","Мешена скара","Mixed Grill",45,"1,5 kg"]

];

let lang="tr";

let selectedCategory="soup";

let quantities={};

function nameOf(item){

  if(lang==="tr")return item[1];

  if(lang==="bg")return item[2];

  return item[3];

}

function setLang(language,button){

  lang=language;

  document.querySelectorAll(".lang button").forEach(b=>{

    b.classList.remove("active");

  });

  button.classList.add("active");

  renderCategories();

  render();

}

function selectCategory(category){

  selectedCategory=category;

  renderCategories();

  render();

  window.scrollTo({top:0,behavior:"smooth"});

}

function renderCategories(){

  const nav=document.getElementById("categoryNav");

  nav.innerHTML="";

  categories.forEach(category=>{

    const button=document.createElement("button");

    button.type="button";

    button.textContent=labels[lang][category];

    if(category===selectedCategory){

      button.classList.add("active");

    }

    button.onclick=()=>selectCategory(category);

    nav.appendChild(button);

  });

}

function changeQty(index,delta){

  quantities[index]=Math.max(

    0,(quantities[index]||0)+delta

  );

  render();

}

function render(){

  const t=labels[lang];

  const menu=document.getElementById("menu");

  menu.innerHTML="";

  const heading=document.createElement("h2");

  heading.textContent=t[selectedCategory];

  menu.appendChild(heading);

  items.forEach((item,i)=>{

    if(item[0]!==selectedCategory)return;

    const div=document.createElement("div");

    div.className="item";

    const info=document.createElement("div");

    info.className="info";

    const name=document.createElement("div");

    name.className="name";

    name.textContent=nameOf(item);

    const weight=document.createElement("div");

    weight.className="weight";

    if(typeof item[5]==="number"){

      weight.textContent=item[5] ? item[5]+" g" : "";

    }else{

      weight.textContent=item[5];

    }

    info.append(name,weight);

    const price=document.createElement("span");

    price.className="price";

    price.textContent=item[4].toFixed(2)+" €";

    const controls=document.createElement("div");

    controls.className="qty";

    const minus=document.createElement("button");

    minus.type="button";

    minus.textContent="−";

    minus.onclick=()=>changeQty(i,-1);

    const count=document.createElement("span");

    count.textContent=quantities[i]||0;

    const plus=document.createElement("button");

    plus.type="button";

    plus.textContent="+";

    plus.onclick=()=>changeQty(i,1);

    controls.append(minus,count,plus);

    div.append(info,price,controls);

    menu.appendChild(div);

  });

  document.getElementById("orderTitle").textContent=t.order;

  document.getElementById("note").textContent=t.note;

  renderOrder();

}

function renderOrder(){

  const t=labels[lang];

  const box=document.getElementById("orderItems");

  box.innerHTML="";

  let total=0;

  let found=false;

  items.forEach((item,i)=>{

    const q=quantities[i]||0;

    if(!q)return;

    found=true;

    total+=q*item[4];

    const line=document.createElement("div");

    line.className="order-line";

    const product=document.createElement("span");

    product.textContent=nameOf(item)+" × "+q;

    const amount=document.createElement("span");

    amount.textContent=(q*item[4]).toFixed(2)+" €";

    line.append(product,amount);

    box.appendChild(line);

  });

  if(!found){

    box.textContent=t.empty;

  }

  document.getElementById("total").textContent=

    t.total+": "+total.toFixed(2)+" €";

}

renderCategories();

render();

</script>

</body>

</html>
