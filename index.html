

<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AROG Restaurant Menu</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#10100e;color:#f5e8c5;font-family:Arial,sans-serif}

header{text-align:center;padding:35px 15px 22px;border-bottom:1px solid #b99a52}

h1{font-family:Georgia,serif;color:#d6b66b;font-size:42px;letter-spacing:7px;margin:0}

.subtitle{color:#d2c39e;letter-spacing:3px;font-size:12px;margin-top:8px}

.languages{text-align:center;padding:18px}

.languages button{background:#24221b;color:#e7ce91;border:1px solid #a88a48;padding:10px 16px;margin:4px;border-radius:20px}

main{max-width:700px;margin:auto;padding:10px 18px 45px}

h2{color:#d6b66b;font-family:Georgia,serif;border-bottom:1px solid #76602f;padding-bottom:10px;margin-top:30px}

.item{display:flex;justify-content:space-between;gap:12px;padding:14px 2px;border-bottom:1px solid #39352a}

.name{font-size:16px}

.weight{color:#a99b7b;font-size:12px;margin-top:5px}

.price{color:#e3c477;font-weight:bold;white-space:nowrap}

.note{text-align:center;color:#b8aa8b;font-size:12px;padding:15px}

.waiter{display:block;margin:25px auto;background:#bd9b50;color:#17140e;border:0;padding:15px 28px;border-radius:30px;font-size:15px;font-weight:bold}

footer{text-align:center;color:#a99b7b;padding:25px;font-size:12px}

</style>

</head>

<body>

<header>

<h1>AROG</h1>

<div class="subtitle">RESTAURANT • PREMIUM MENU</div>

</header>

<div class="languages">

<button onclick="lang='tr';render()">Türkçe</button>

<button onclick="lang='bg';render()">Български</button>

<button onclick="lang='en';render()">English</button>

</div>

<main id="menu"></main>

<button class="waiter" onclick="alert(labels[lang].wait)">🔔 <span id="waitText">Garson Çağır</span></button>

<div class="note" id="note"></div>

<footer>AROG RESTAURANT · Добре дошли</footer>

<script>

let lang='tr';

const labels={

tr:{main:'Ana Yemekler',soup:'Çorbalar',pizza:'Pizzalar',pide:'Türk Pideleri',wait:'Garson çağırma bildirimi bu menüde aktif değildir. Lütfen personelimize seslenin.',button:'Garson Çağır',note:'Afiyet olsun!'},

bg:{main:'Основни ястия',soup:'Супи',pizza:'Пици',pide:'Турски пидета',wait:'Известията за повикване на сервитьор не са активни. Моля, обърнете се към персонала.',button:'Повикай сервитьор',note:'Добър апетит!'},

en:{main:'Main Dishes',soup:'Soups',pizza:'Pizzas',pide:'Turkish Pide',wait:'Waiter notifications are not active on this menu. Please ask a staff member.',button:'Call Waiter',note:'Enjoy your meal!'}

};

const data=[

['main','Drobceta po selski','6 €','400 g','Селски дреболии','Village-style tripe'],

['main','Arnavudski drobceta','8 €','400 g','Арнаутски дреболии','Albanian-style tripe'],

['main','Lahmacun','5 €','','Лахмаджун','Lahmacun'],

['main','İskender kebap s pileshki dyuner','7 €','450 g','Искендер с пилешки дюнер','Chicken doner Iskender'],

['main','İskender kebap s kayma dyuner','9 €','450 g','Искендер с кайма дюнер','Minced meat Iskender'],

['main','İcli kyufte','5 €','300 g','Ичли кюфте','Stuffed kofte'],

['soup','Tarator','2 €','250 g','Таратор','Tarator'],

['soup','Shkembe supa','2 €','250 g','Шкембе чорба','Tripe soup'],

['soup','Pileshka supa','2 €','250 g','Пилешка супа','Chicken soup'],

['soup','Cervena leshta','2 €','250 g','Червена леща','Red lentil soup'],

['soup','Domatena supa','2 €','250 g','Доматена супа','Tomato soup'],

['soup','Supa topceta','2 €','250 g','Супа топчета','Meatball soup'],

['pizza','Margarita','5 €','400 g','Маргарита','Margherita'],

['pizza','Shunka','5.50 €','450 g','Шунка','Ham'],

['pizza','Turski sucuk','6.50 €','500 g','Турски суджук','Turkish sucuk'],

['pizza','Pileshki dyuner','6.50 €','500 g','Пилешки дюнер','Chicken doner'],

['pizza','Riba ton','5.50 €','500 g','Риба тон','Tuna'],

['pizza','Kapricoza','7 €','550 g','Капричоза','Capricciosa'],

['pizza','Arog pizza','9 €','650 g','Пица АРОГ','AROG pizza'],

['pide','Яйчен','7 €','450 g','Яйчен','Egg pide'],

['pide','S kayma','7 €','450 g','С кайма','Minced meat pide'],

['pide','S turski sudjuk','7 €','450 g','С турски суджук','Turkish sucuk pide'],

['pide','S riba ton','6 €','450 g','С риба тон','Tuna pide'],

['pide','Mesheno','8 €','500 g','Мешено','Mixed pide']

];

function render(){

let l=labels[lang],cats=['main','soup','pizza','pide'];

document.getElementById('menu').innerHTML=cats.map(c=>

'<section><h2>'+l[c]+'</h2>'+data.filter(x=>x[0]===c).map(x=>{

let name=lang==='tr'?x[1]:lang==='bg'?x[4]:x[5];

return '<div class="item"><div><div class="name">'+name+'</div><div class="weight">'+x[3]+'</div></div><div class="price">'+x[2]+'</div></div>';

}).join('')+'</section>').join('');

document.getElementById('waitText').textContent=l.button;

document.getElementById('note').textContent=l.note;

}

render();

</script>

</body>

</html>
